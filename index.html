<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알바 가용 일정 보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">PART-TIME AVAILABILITY BOARD</p>
        <h1>알바 지원자 가용 일정 관리</h1>
        <p class="hero-copy">
          지원자 목록, 근무 가능 날짜, 날짜별 최종 선택 상태를 한 화면에서 확인하고 바로 저장할 수 있습니다.
        </p>
      </div>
      <div class="hero-actions">
        <button id="toggleFormButton" class="ghost-button" type="button" aria-expanded="true">
          등록란 접기
        </button>
        <button id="resetDataButton" class="ghost-button" type="button">초기 데이터로 되돌리기</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel panel-form" id="formPanel">
        <div class="panel-header">
          <div>
            <h2>지원자 등록</h2>
            <p>새 지원자를 추가하거나 기존 지원자 정보를 수정할 수 있습니다.</p>
          </div>
        </div>

        <div id="formPanelBody" class="panel-body">
          <form id="applicantForm" class="applicant-form">
            <input type="hidden" id="applicantId">

            <label>
              이름
              <input id="name" name="name" type="text" required>
            </label>

            <label>
              연락처
              <input id="phone" name="phone" type="text" placeholder="010-0000-0000" required>
            </label>

            <div class="grid-two">
              <label>
                나이
                <input id="age" name="age" type="number" min="0" max="99" required>
              </label>

              <label>
                성별
                <select id="gender" name="gender" required>
                  <option value="여성">여성</option>
                  <option value="남성">남성</option>
                </select>
              </label>
            </div>

            <label>
              거주지역
              <input id="region" name="region" type="text" required>
            </label>

            <label>
              희망근무 메모
              <textarea id="notes" name="notes" rows="4" placeholder="예: 6월 25일부터 가능, 매주 월화수 가능"></textarea>
            </label>

            <label>
              추가할 근무 가능 날짜
              <input id="dateInput" name="dateInput" type="date">
            </label>

            <div class="inline-actions">
              <button id="addDateButton" class="secondary-button" type="button">날짜 추가</button>
              <div id="draftDates" class="draft-dates"></div>
            </div>

            <div class="form-actions">
              <button class="primary-button" type="submit">저장하기</button>
              <button id="cancelEditButton" class="ghost-button hidden" type="button">수정 취소</button>
            </div>
          </form>
        </div>
      </section>

      <section class="panel panel-calendar">
        <div class="panel-header">
          <div>
            <h2>달력 보기</h2>
            <p>날짜를 누르면 가능한 인원을 보고, 여러 명을 최종 선택할 수 있습니다.</p>
          </div>
          <div class="calendar-toolbar">
            <button id="prevMonthButton" class="icon-button" type="button" aria-label="이전 달">&lt;</button>
            <h3 id="calendarTitle"></h3>
            <button id="nextMonthButton" class="icon-button" type="button" aria-label="다음 달">&gt;</button>
          </div>
        </div>

        <div class="filter-bar">
          <label for="applicantFilter">표시 대상</label>
          <select id="applicantFilter"></select>
        </div>

        <div id="calendar" class="calendar"></div>

        <div class="date-panel">
          <div>
            <h3 id="selectedDateTitle">날짜를 선택해 주세요</h3>
            <p id="selectedDateHint">선택한 날짜의 지원 상태가 이곳에 표시됩니다.</p>
          </div>
          <div id="selectedDateApplicants" class="selected-date-applicants"></div>
        </div>
      </section>

      <section class="panel panel-list">
        <div class="panel-header">
          <h2>가용 가능 리스트</h2>
          <p>지원자별 가능 날짜 수와 선택된 날짜 수를 함께 확인할 수 있습니다.</p>
        </div>
        <div id="applicantList" class="applicant-list"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
